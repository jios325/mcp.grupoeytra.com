# /etc/apache2/sites-available/subdominio-mcp.grupoeytra.com.conf
# (nombre que ordena después de grupoeytra.com.conf: el primer vhost es el predeterminado de Apache)
# Servidor MCP del repo mcp.grupoeytra.com (contenedor eytra-mcp en 127.0.0.1:8330).
# certbot --apache -d mcp.grupoeytra.com --redirect genera la versión -le-ssl.
<VirtualHost *:80>
    ServerAdmin soporteweb@elitekode.com
    ServerName mcp.grupoeytra.com
    ProxyRequests Off
    ProxyPreserveHost On

    ProxyPass /.well-known/acme-challenge/ !

    # mod_proxy agrega X-Forwarded-For con la IP real; el MCP toma la última entrada (CLIENT_IP_HEADER).
    # Las respuestas pueden subir a SSE si una herramienta manda avisos: sin búfer.
    ProxyTimeout 120
    ProxyPass / http://127.0.0.1:8330/ flushpackets=on
    ProxyPassReverse / http://127.0.0.1:8330/
    RequestHeader set X-Forwarded-Proto "https"

    # El MCP limita los JSON a 256 KB y los formularios a 20 KB; Apache corta antes lo que pase de 1 MB.
    LimitRequestBody 1048576
    Header always set X-Robots-Tag "noindex, nofollow"

    ErrorLog ${APACHE_LOG_DIR}/mcp.grupoeytra.com-error.log
    CustomLog ${APACHE_LOG_DIR}/mcp.grupoeytra.com-access.log combined
</VirtualHost>
